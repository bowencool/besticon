<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Besticon</title>
  <desc id="desc">A white B monogram with a cyan sparkle on a blue violet rounded square.</desc>

  <defs>
    <linearGradient id="bg" x1="72" y1="64" x2="440" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="0.48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shine" x1="149" y1="124" x2="362" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#172554" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- A strong app-tile silhouette remains clear in Unraid's 32–64 px icon view. -->
  <rect x="40" y="40" width="432" height="432" rx="108" fill="url(#bg)" filter="url(#shadow)"/>
  <path d="M80 151C80 111.8 111.8 80 151 80h210c22.1 0 40 17.9 40 40v4c-114-25-232-9-321 43v-16Z" fill="#FFFFFF" opacity="0.16"/>

  <!-- Bold B monogram: simple enough to survive favicon-scale rendering. -->
  <path fill="url(#shine)" fill-rule="evenodd" d="M151 126c-14.9 0-27 12.1-27 27v206c0 14.9 12.1 27 27 27h111c69.8 0 116-36.1 116-94 0-34.7-17.7-59.3-48.8-72.9C351.5 205.2 364 184 364 158.8 364 108.9 323.9 78 258.9 78H151Zm53 73v-55h51.5c19.6 0 31.5 9.3 31.5 25.8 0 18.3-12.9 29.2-34.5 29.2H204Zm0 121v-61h63.2c21 0 34.8 10.8 34.8 29.8 0 20-14.2 31.2-39.7 31.2H204Z"/>

  <!-- Best-result sparkle. -->
  <circle cx="377" cy="130" r="62" fill="#0F172A" opacity="0.18"/>
  <circle cx="377" cy="124" r="58" fill="#083344"/>
  <path d="M377 82c5.1 21.6 16.4 32.9 38 38-21.6 5.1-32.9 16.4-38 38-5.1-21.6-16.4-32.9-38-38 21.6-5.1 32.9-16.4 38-38Z" fill="#67E8F9"/>
</svg>
